spring.application.name=eventos

spring.datasource.url=jdbc:postgresql://localhost:5432/event_service
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Alterado 8081 para 8761 e ajustada a sintaxe do defaultZone
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.int[1,50]}