spring.application.name=api-gateway
server.port=8080

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Rota para o microsservico de eventos, localizado via Eureka (lb://eventos)
spring.cloud.gateway.server.webflux.routes[0].id=eventos-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://eventos
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eventos/**
